<!DOCTYPE html>
<html>
    <head>
        <title>Project 1: Lists</title>
    </head>
    <body>
        <h1><s>HTML Basics</s>: <a href="../index.html">Home</a>/Lists</h1>
        <h2>Unordered List</h2>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
        <h3>Ordered List</h3>
        <ol>
            <li>First Item</li>
            <li><u>Second Item</u></li>
            <li>Third Item</li>
        </ol>
        <h4>Ordered List with Roman Numerals</h4>
        <ol type="i">
            <li><i>First Item</i></li>
            <li>Second Item</li>
            <li><strong>Third Item</strong></li>
        </ol>
    </body>
</html>
