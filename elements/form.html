<HTML:5>
    <head>
        <title>Project 1: Forms</title>
    </head>
    <body>
        <h1>HTML Basics: <a href="../index.html">Home</a>/Forms</h1>
        <form>
            <fieldset>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name"><br><br>
            </fieldset>
            <fieldset>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email"><br><br>
            </fieldset>
            <fieldset>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required="True"><br><br>
            </fieldset>
            <fieldset>
                <legend>Select your favorite language:</legend>
                    <div>
                        <input type="radio" id="html" name="language" value="HTML">
                        <label for="html">HTML</label>
                    </div>
                    <div>
                        <input type="radio" id="css" name="language" value="CSS">
                        <label for="css">CSS</label>
                    </div>
                    <div>
                        <input type="radio" id="javascript" name="language" value="JavaScript">
                        <label for="javascript">JavaScript</label>
                    </div>
            </fieldset>
            <fieldset>
                <label for="comment">Leave a Comment:</label>
                <textarea id="comment" name="comment" rows="4" cols="50" placeholder="Type your feedback here..."></textarea>
                <input type="submit" value="Submit">
            </fieldset>
            <input type="submit" value="Submit">
        </form>
    </body>
</HTML:5>
